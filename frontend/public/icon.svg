<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5EFC" />
      <stop offset="45%" stop-color="#3B4CCA" />
      <stop offset="100%" stop-color="#232E8F" />
    </linearGradient>

    <!-- Subtle Top Ambient Glow -->
    <radialGradient id="topGlow" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Shield / Badge Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#EAEFF8" stop-opacity="0.92" />
    </linearGradient>

    <!-- Teal Accent Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Gold Accent Gradient for Tassel -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowPlate" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>

    <filter id="shadowMark" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base App Background (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#topGlow)" />

  <!-- Inner Soft Ring Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3" />

  <!-- Main Academic + Attendance Emblem Group -->
  <g id="emblem" filter="url(#shadowPlate)">
    <!-- Base White Academic Shield -->
    <path d="M 256 128
             C 328 128 376 148 376 148
             C 376 264 336 348 256 392
             C 176 348 136 264 136 148
             C 136 148 184 128 256 128 Z"
          fill="url(#shieldGrad)" />

    <!-- Inner Shield Accent Rim -->
    <path d="M 256 142
             C 318 142 360 159 360 159
             C 360 258 325 332 256 372
             C 187 332 152 258 152 159
             C 152 159 194 142 256 142 Z"
          fill="none" stroke="#E2E8F0" stroke-width="2" />

    <!-- Graduation Cap Top (Diamond Mortarboard) -->
    <g filter="url(#shadowMark)">
      <!-- Diamond Board -->
      <polygon points="256,170 348,212 256,254 164,212" fill="#3B4CCA" />
      <polygon points="256,170 348,212 256,218 164,212" fill="#4B5EFC" opacity="0.6" />

      <!-- Skull Cap Underneath -->
      <path d="M 206 232 C 206 256 306 256 306 232 Z" fill="#232E8F" />

      <!-- Cap Button -->
      <circle cx="256" cy="212" r="7" fill="url(#goldGrad)" />

      <!-- Tassel Hanging to the Left -->
      <path d="M 256 212 Q 220 220 208 245" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
      <polygon points="204,244 212,244 214,268 202,268" fill="url(#goldGrad)" />
    </g>

    <!-- Smart Attendance Checkmark (Deep Teal to Emerald) -->
    <g filter="url(#shadowMark)">
      <path d="M 214 298
               L 244 328
               L 304 266"
            fill="none"
            stroke="url(#tealGrad)"
            stroke-width="18"
            stroke-linecap="round"
            stroke-linejoin="round" />
    </g>

    <!-- Small Smart Pulse / Dot above checkmark -->
    <circle cx="316" cy="254" r="5" fill="#2DD4BF" />
  </g>
</svg>

